<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Central Vylo Digital</title>
<style>
  :root{
    --purple:#5b0ca5; --blue:#2d5aa8; --teal:#14c9a8; --teal-soft:#2ee6c5;
    --text:#ffffff; --muted:#cfe3de;
    --glass:rgba(255,255,255,.08); --glass-border:rgba(255,255,255,.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; padding:0;
    background:#11121a;
    font-family: 'Segoe UI', Arial, sans-serif; color:var(--text);
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:14px 20px;
    border-bottom:1px solid var(--glass-border);
  }
  header img{height:32px;}
  header h1{font-size:1.1em; letter-spacing:2px; margin:0; font-weight:700;}

  .panels{
    flex:1; display:grid; gap:14px; padding:14px; min-height:0;
    grid-template-columns:1fr 2fr;
    grid-template-rows:1fr 1fr;
    grid-template-areas:
      "ranking bi"
      "calendar bi";
  }
  .panel{
    display:flex; flex-direction:column; background:var(--glass);
    border:1px solid var(--glass-border); border-radius:12px; overflow:hidden;
    min-height:0;
  }
  .panel-ranking{grid-area:ranking;}
  .panel-calendar{grid-area:calendar;}
  .panel-bi{grid-area:bi;}
  .panel-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; border-bottom:1px solid var(--glass-border);
    font-size:.85em; font-weight:700; letter-spacing:1px; color:var(--teal-soft);
  }
  .panel-header a{color:var(--muted); font-weight:400; font-size:.85em; text-decoration:none;}
  .panel-header a:hover{color:#fff; text-decoration:underline;}
  .panel-body{flex:1; min-height:0; position:relative; background:transparent;}
  .panel-bi .panel-body,
  .panel-ranking .panel-body{background:#fff;}
  .panel-body iframe{width:100%; height:100%; border:0; display:block;}
  .panel-note{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:20px; color:#666; font-size:.85em; background:#fff;
    line-height:1.6;
  }
  .panel-note-inner{max-width:340px;}
  .panel-note code{background:#f0f0f0; padding:1px 5px; border-radius:4px; font-size:.9em;}
  .panel-note .btn{
    display:inline-block; margin-top:14px; padding:8px 18px; border-radius:8px;
    background:var(--purple); color:#fff; text-decoration:none; font-weight:700; font-size:.9em;
  }

  .cal-list{
    position:absolute; inset:0; overflow-y:auto; padding:12px; background:transparent;
  }
  .cal-item{
    background:rgba(255,255,255,.05); border:1px solid var(--glass-border); border-radius:10px;
    padding:10px 12px; margin-bottom:8px;
  }
  .cal-row1{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .cal-left{display:flex; align-items:center; gap:6px;}
  .cal-date{font-size:.75em; color:var(--teal-soft); font-weight:700; letter-spacing:.5px;}
  .cal-source{font-size:.65em; color:#d4b3ff; background:rgba(91,12,165,.35); border:1px solid rgba(91,12,165,.6); padding:1px 7px; border-radius:10px; font-weight:700;}
  .cal-status{padding:1px 8px; border-radius:12px; font-size:.68em; font-weight:700; letter-spacing:.3px;}
  .cal-status.concluido{background:rgba(62,207,126,.18); color:#3ecf7e;}
  .cal-status.andamento{background:rgba(84,150,255,.18); color:#7fb0ff;}
  .cal-status.pendente{background:rgba(255,255,255,.12); color:var(--muted);}
  .cal-headline{font-size:.88em; font-weight:600; color:#fff; margin-bottom:6px; line-height:1.35;}
  .cal-tags{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px;}
  .cal-tag{background:rgba(255,255,255,.1); color:var(--muted); font-size:.68em; padding:1px 7px; border-radius:8px;}
  .cal-resp{font-size:.72em; color:var(--muted);}
  .cal-status-msg{padding:12px; text-align:center; color:var(--muted); font-size:.8em;}

  @media (max-width: 1000px){
    .panels{
      grid-template-columns:1fr; grid-template-rows:none;
      grid-template-areas:"ranking" "calendar" "bi";
      grid-auto-rows:minmax(420px, 1fr);
    }
  }
</style>
</head>
<body>

  <header>
    <img src="vylo-logo.png" alt="Vylo Digital">
    <h1>CENTRAL VYLO DIGITAL</h1>
  </header>

  <div class="panels">

    <div class="panel panel-ranking">
      <div class="panel-header">
        <span>🏆 LIGA DE VENDAS</span>
        <a href="ranking.html" target="_blank">abrir em nova aba ↗</a>
      </div>
      <div class="panel-body">
        <iframe src="ranking.html" title="Liga de Vendas" loading="lazy"></iframe>
      </div>
    </div>

    <div class="panel panel-calendar">
      <div class="panel-header">
        <span>🗓 CALENDÁRIO EDITORIAL</span>
        <a href="https://app.notion.com/p/Calend-rios-Editoriais-3aecea585a8e8084bb25e0bdb1d2e72b?source=copy_link" target="_blank">abrir em nova aba ↗</a>
      </div>
      <div class="panel-body">
        <div class="cal-list" id="cal-list">
          <div class="cal-status-msg" id="cal-status">Carregando calendário...</div>
        </div>
      </div>
    </div>

    <div class="panel panel-bi">
      <div class="panel-header">
        <span>📊 BI MERCADO LIVRE</span>
        <a href="https://app.powerbi.com/view?r=eyJrIjoiOWRiMzA2MjctZjVjMy00NTYxLTg2OTktYmM4NDZhNThiYmI0IiwidCI6IjNlZDU4NGFmLTQ1OTMtNDNlOS04MzIwLTg3Nzg4YTczMDkxYSJ9&disablecdnExpiration=1786486807" target="_blank">abrir em nova aba ↗</a>
      </div>
      <div class="panel-body">
        <iframe src="https://app.powerbi.com/view?r=eyJrIjoiOWRiMzA2MjctZjVjMy00NTYxLTg2OTktYmM4NDZhNThiYmI0IiwidCI6IjNlZDU4NGFmLTQ1OTMtNDNlOS04MzIwLTg3Nzg4YTczMDkxYSJ9&disablecdnExpiration=1786486807" title="BI Mercado Livre" loading="lazy" allowfullscreen></iframe>
      </div>
    </div>

  </div>

<script>
  const CAL_STATUS_CLASS = {
    'Concluído': 'concluido',
    'Em andamento': 'andamento',
  };

  function fmtDate(iso){
    if (!iso) return '';
    const [y,m,d] = iso.split('-');
    return `${d}/${m}`;
  }

  function renderCalendar(rows){
    const list = document.getElementById('cal-list');
    if (!rows.length){
      list.innerHTML = '<div class="cal-status-msg">Nenhum item encontrado no calendário.</div>';
      return;
    }
    list.innerHTML = rows.map(r => {
      const status = r['Status'] || '';
      const statusClass = CAL_STATUS_CLASS[status] || 'pendente';
      const headline = r['Headline & Conteúdo'] || r['Headline'] || r['_title'] || '(sem título)';
      const tags = [r['Formato'], r['Canal']].filter(Boolean).join(', ');
      const resp = r['Responsável'] || '';
      const source = r['_source'] || '';
      return `
        <div class="cal-item">
          <div class="cal-row1">
            <div class="cal-left">
              <span class="cal-date">${fmtDate(r['Data'])}</span>
              ${source ? `<span class="cal-source">${source}</span>` : ''}
            </div>
            <span class="cal-status ${statusClass}">${status || '—'}</span>
          </div>
          <div class="cal-headline">${headline}</div>
          ${tags ? `<div class="cal-tags">${tags.split(', ').map(t => `<span class="cal-tag">${t}</span>`).join('')}</div>` : ''}
          ${resp ? `<div class="cal-resp">👤 ${resp}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  async function loadCalendar(){
    const statusMsg = document.getElementById('cal-status');
    try {
      const res = await fetch('/api/calendario', { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      renderCalendar(data.rows || []);
    } catch (err) {
      document.getElementById('cal-list').innerHTML =
        `<div class="cal-status-msg">Não foi possível carregar o calendário (${err.message}).<br><br>Confira se NOTION_TOKEN e NOTION_DATABASE_ID estão configurados na Vercel.</div>`;
    }
  }

  loadCalendar();
  setInterval(loadCalendar, 30000);
</script>
</body>
</html>
