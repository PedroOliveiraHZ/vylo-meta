<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Central Vylo Digital</title>
<style>
  :root{
    --purple:#5b0ca5; --blue:#2d5aa8; --teal:#14c9a8; --teal-soft:#2ee6c5;
    --text:#ffffff; --muted:#cfe3de;
    --glass:rgba(255,255,255,.08); --glass-border:rgba(255,255,255,.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; padding:0;
    background: linear-gradient(135deg, #4b0e93 0%, #2d5aa8 45%, #12a389 100%);
    font-family: 'Segoe UI', Arial, sans-serif; color:var(--text);
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:14px 20px;
    border-bottom:1px solid var(--glass-border);
  }
  header img{height:32px;}
  header h1{font-size:1.1em; letter-spacing:2px; margin:0; font-weight:700;}

  .panels{
    flex:1; display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; padding:14px;
    min-height:0;
  }
  .panel{
    display:flex; flex-direction:column; background:var(--glass);
    border:1px solid var(--glass-border); border-radius:12px; overflow:hidden;
    min-height:0;
  }
  .panel-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; border-bottom:1px solid var(--glass-border);
    font-size:.85em; font-weight:700; letter-spacing:1px; color:var(--teal-soft);
  }
  .panel-header a{color:var(--muted); font-weight:400; font-size:.85em; text-decoration:none;}
  .panel-header a:hover{color:#fff; text-decoration:underline;}
  .panel-body{flex:1; min-height:0; position:relative; background:#fff;}
  .panel-body iframe{width:100%; height:100%; border:0; display:block;}
  .panel-note{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:20px; color:#666; font-size:.85em; background:#fff;
  }

  @media (max-width: 1000px){
    .panels{grid-template-columns:1fr; grid-auto-rows:minmax(420px, 1fr);}
  }
</style>
</head>
<body>

  <header>
    <img src="vylo-logo.png" alt="Vylo Digital">
    <h1>CENTRAL VYLO DIGITAL</h1>
  </header>

  <div class="panels">

    <div class="panel">
      <div class="panel-header">
        <span>🏆 LIGA DE VENDAS</span>
        <a href="ranking.html" target="_blank">abrir em nova aba ↗</a>
      </div>
      <div class="panel-body">
        <iframe src="ranking.html" title="Liga de Vendas" loading="lazy"></iframe>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>🗓 CALENDÁRIO EDITORIAL</span>
        <a href="https://app.notion.com/p/Calend-rios-Editoriais-3aecea585a8e8084bb25e0bdb1d2e72b" target="_blank">abrir em nova aba ↗</a>
      </div>
      <div class="panel-body">
        <iframe src="https://app.notion.com/p/Calend-rios-Editoriais-3aecea585a8e8084bb25e0bdb1d2e72b" title="Calendário Editorial" loading="lazy"></iframe>
        <div class="panel-note" id="notion-note" style="display:none;">
          O Notion está bloqueando a exibição aqui dentro (precisa estar logado / compartilhado publicamente).<br>
          Use "abrir em nova aba" acima.
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>📊 BI MERCADO LIVRE</span>
        <a href="https://app.powerbi.com/view?r=eyJrIjoiOWRiMzA2MjctZjVjMy00NTYxLTg2OTktYmM4NDZhNThiYmI0IiwidCI6IjNlZDU4NGFmLTQ1OTMtNDNlOS04MzIwLTg3Nzg4YTczMDkxYSJ9&disablecdnExpiration=1786486807" target="_blank">abrir em nova aba ↗</a>
      </div>
      <div class="panel-body">
        <iframe src="https://app.powerbi.com/view?r=eyJrIjoiOWRiMzA2MjctZjVjMy00NTYxLTg2OTktYmM4NDZhNThiYmI0IiwidCI6IjNlZDU4NGFmLTQ1OTMtNDNlOS04MzIwLTg3Nzg4YTczMDkxYSJ9&disablecdnExpiration=1786486807" title="BI Mercado Livre" loading="lazy" allowfullscreen></iframe>
      </div>
    </div>

  </div>

</body>
</html>
